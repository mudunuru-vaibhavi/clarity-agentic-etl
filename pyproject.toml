[project]
name = "clarity-agentic-etl"
version = "0.1.0"
description = "Agentic ETL proof of concept: synthetic Epic Clarity extracts to a SQL warehouse, watched by a self-healing investigation agent, with CI/CD and a reporting dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "paramiko>=3.4",
    "pandas>=2.2",
]

[project.optional-dependencies]
mssql = ["pymssql>=2.3"]
postgres = ["psycopg[binary]>=3.2"]
dashboard = ["streamlit>=1.40", "plotly>=5.24"]

[project.scripts]
clarity-etl = "clarity_etl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_etl"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
